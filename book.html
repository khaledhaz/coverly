<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C4522A">
<title>Reserve a Table — Coverly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
/* ===== BOOK PAGE SHELL ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;overflow-x:hidden;max-width:100%}
body{background:var(--color-bg);min-height:100vh;display:flex;flex-direction:column;width:100%}

/* ===== BRANDED HEADER ===== */
.bk-header{
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:var(--space-5) var(--space-5);
  display:flex;align-items:center;gap:var(--space-4);
  min-width:0;flex-wrap:wrap;
}
.bk-logo{
  width:48px;height:48px;border-radius:var(--radius-md);flex-shrink:0;
  background:var(--color-restaurant-accent);display:flex;align-items:center;justify-content:center;
  color:var(--color-restaurant-accent-foreground);font-size:22px;font-weight:700;letter-spacing:-0.02em;
  overflow:hidden;
}
.bk-logo img{width:100%;height:100%;object-fit:cover;display:block}
.bk-header-info{flex:1;min-width:0}
.bk-header-name{
  font-size:20px;font-weight:700;letter-spacing:-0.02em;color:var(--color-text-primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bk-header-address{
  font-size:13px;color:var(--color-text-muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bk-header-badge{
  flex-shrink:0;background:var(--color-success-light);color:var(--color-success);
  font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--radius-full);
  white-space:nowrap;
}

/* ===== MAIN CONTENT ===== */
.bk-main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:var(--space-8) var(--space-5) var(--space-12);
  min-width:0;
}
.bk-card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-md);
  width:100%;max-width:480px;overflow:hidden;
}

/* ===== STEP PROGRESS ===== */
.bk-progress{
  padding:var(--space-5) var(--space-6) var(--space-4);
  border-bottom:1px solid var(--color-border);
}
.bk-progress-track{
  height:3px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden;margin-bottom:var(--space-3);
}
.bk-progress-fill{
  height:100%;background:var(--color-restaurant-accent);border-radius:var(--radius-full);
  transition:width var(--duration-normal) var(--easing-standard);
}
.bk-step-label{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text-muted)}

/* ===== STEP BODY ===== */
.bk-body{padding:var(--space-6)}

.bk-section-title{
  font-size:18px;font-weight:600;letter-spacing:-0.01em;color:var(--color-text-primary);
  margin-bottom:var(--space-5);
}

/* ===== DATE PICKER ===== */
.bk-date-input{
  width:100%;min-height:52px;padding:var(--space-3) var(--space-4);
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-md);font-size:16px;color:var(--color-text-primary);
  transition:border-color var(--duration-fast);
}
.bk-date-input:focus{outline:none;border-color:var(--color-restaurant-accent);box-shadow:0 0 0 3px rgba(196,82,42,.12)}

/* ===== PARTY SELECTOR ===== */
.bk-party-grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2);
}
@media(max-width:420px){.bk-party-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:374px){.bk-party-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bk-party-btn{
  aspect-ratio:1;border-radius:var(--radius-md);border:2px solid var(--color-border);
  background:var(--color-surface);font-size:15px;font-weight:600;color:var(--color-text-primary);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  min-width:0;min-height:44px;width:100%;
  transition:border-color var(--duration-fast),background var(--duration-fast),color var(--duration-fast);
}
.bk-party-btn:hover{border-color:var(--color-restaurant-accent);background:var(--color-primary-light)}
.bk-party-btn.selected{
  border-color:var(--color-restaurant-accent);
  background:var(--color-restaurant-accent);
  color:var(--color-restaurant-accent-foreground);
}
.bk-party-btn:focus-visible{outline:2px solid var(--color-restaurant-accent);outline-offset:2px}
.bk-party-more{
  width:100%;min-height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border);
  background:var(--color-surface);color:var(--color-text-secondary);font-size:14px;
  cursor:pointer;margin-top:var(--space-3);
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  transition:border-color var(--duration-fast),background var(--duration-fast);
}
.bk-party-more:hover{border-color:var(--color-restaurant-accent);background:var(--color-primary-light)}
.bk-party-more.hidden{display:none}
.bk-party-large{margin-top:var(--space-3);display:none}
.bk-party-large.show{display:flex;align-items:center;gap:var(--space-3)}
.bk-party-large .bk-date-input{min-height:44px;font-size:15px}

/* ===== SLOT GRID ===== */
.bk-slots-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);
}
@media(max-width:374px){.bk-slots-grid{grid-template-columns:repeat(2,1fr)}}
.bk-slot{
  min-height:52px;border-radius:var(--radius-md);border:2px solid var(--color-border);
  background:var(--color-surface);font-size:14px;font-weight:600;color:var(--color-text-primary);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color var(--duration-fast),background var(--duration-fast),color var(--duration-fast);
  padding:var(--space-2);
}
.bk-slot:hover{border-color:var(--color-restaurant-accent);background:var(--color-primary-light)}
.bk-slot.selected{
  border-color:var(--color-restaurant-accent);background:var(--color-restaurant-accent);
  color:var(--color-restaurant-accent-foreground);
}
.bk-slot-limited{
  font-size:10px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--color-warning);opacity:.9;
}
.bk-slot.selected .bk-slot-limited{color:var(--color-restaurant-accent-foreground);opacity:.8}
.bk-slot:focus-visible{outline:2px solid var(--color-restaurant-accent);outline-offset:2px}

/* ===== FORM ===== */
.bk-form-row{margin-bottom:var(--space-4)}
.bk-form-row label{display:block;font-size:14px;font-weight:500;color:var(--color-text-secondary);margin-bottom:var(--space-2)}
.bk-form-row .bk-date-input{font-size:15px}
.bk-required{color:var(--color-destructive);margin-left:2px}
.bk-opt{font-size:12px;color:var(--color-text-muted);font-weight:400;margin-left:4px}
.bk-char{font-size:12px;color:var(--color-text-muted);float:right;margin-top:var(--space-1)}
.bk-booking-summary{
  background:var(--color-surface-raised);border-radius:var(--radius-md);border:1px solid var(--color-border);
  padding:var(--space-4);margin-bottom:var(--space-5);font-size:14px;
}
.bk-booking-summary-row{display:flex;gap:var(--space-3);align-items:baseline;margin-bottom:var(--space-2)}
.bk-booking-summary-row:last-child{margin-bottom:0}
.bk-booking-summary-label{font-size:12px;font-weight:500;color:var(--color-text-muted);min-width:60px;flex-shrink:0}
.bk-booking-summary-val{font-weight:600;color:var(--color-text-primary);min-width:0;word-break:break-word}

/* ===== ACTIONS ===== */
.bk-actions{display:flex;gap:var(--space-3);margin-top:var(--space-5);flex-wrap:wrap}
.bk-btn-primary{
  flex:1;min-height:52px;border-radius:var(--radius-full);
  background:var(--color-restaurant-accent);color:var(--color-restaurant-accent-foreground);
  font-size:16px;font-weight:600;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  transition:filter var(--duration-fast),transform var(--duration-instant);
}
.bk-btn-primary:hover{filter:brightness(.94)}
.bk-btn-primary:active{transform:scale(.98)}
.bk-btn-primary:disabled{opacity:.5;cursor:not-allowed}
.bk-btn-back{
  min-height:52px;padding:0 var(--space-5);border-radius:var(--radius-full);
  background:var(--color-surface);color:var(--color-text-primary);
  border:1px solid var(--color-border);font-size:15px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:var(--space-2);flex-shrink:0;
  transition:background var(--duration-fast);
}
.bk-btn-back:hover{background:var(--color-surface-raised)}
.bk-btn-primary:focus-visible,.bk-btn-back:focus-visible{outline:2px solid var(--color-restaurant-accent);outline-offset:2px}

/* ===== STATUS STATES ===== */
.bk-status{
  text-align:center;padding:var(--space-10) var(--space-6);
}
.bk-status-icon{
  width:64px;height:64px;border-radius:50%;margin:0 auto var(--space-4);
  display:flex;align-items:center;justify-content:center;
}
.bk-status-icon.loading{background:var(--color-surface-raised)}
.bk-status-icon.empty{background:var(--color-surface-raised)}
.bk-status-icon.error{background:var(--color-destructive-light)}
.bk-status-icon.success{background:var(--color-success-light)}
.bk-status-title{font-size:18px;font-weight:600;color:var(--color-text-primary);margin-bottom:var(--space-2);letter-spacing:-0.01em}
.bk-status-desc{font-size:14px;color:var(--color-text-secondary);line-height:1.6;max-width:320px;margin:0 auto var(--space-5)}
.bk-spin{
  width:28px;height:28px;border:3px solid var(--color-border);
  border-top-color:var(--color-restaurant-accent);border-radius:50%;
  animation:bk-spin .7s linear infinite;
}
@keyframes bk-spin{to{transform:rotate(360deg)}}
.bk-no-slots-grid{display:flex;flex-direction:column;gap:var(--space-3)}

/* ===== CONFIRMATION ===== */
.bk-confirm-icon{
  width:72px;height:72px;border-radius:50%;margin:0 auto var(--space-5);
  background:var(--color-success-light);display:flex;align-items:center;justify-content:center;
}
.bk-confirm-title{font-size:22px;font-weight:700;color:var(--color-text-primary);letter-spacing:-0.02em;text-align:center;margin-bottom:var(--space-2)}
.bk-confirm-sub{font-size:14px;color:var(--color-text-secondary);text-align:center;margin-bottom:var(--space-6);line-height:1.6}
.bk-confirm-detail{
  background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius-lg);
  padding:var(--space-5);margin-bottom:var(--space-5);
}
.bk-confirm-row{display:flex;gap:var(--space-3);margin-bottom:var(--space-3);align-items:flex-start}
.bk-confirm-row:last-child{margin-bottom:0}
.bk-confirm-label{font-size:12px;font-weight:500;color:var(--color-text-muted);min-width:72px;flex-shrink:0;padding-top:1px}
.bk-confirm-val{font-size:14px;font-weight:600;color:var(--color-text-primary);min-width:0;word-break:break-word}
.bk-confirm-actions{display:flex;flex-direction:column;gap:var(--space-3)}
.bk-cal-btn{
  min-height:48px;border-radius:var(--radius-full);border:1px solid var(--color-border);
  background:var(--color-surface);color:var(--color-text-primary);
  font-size:15px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  text-decoration:none;transition:background var(--duration-fast);
}
.bk-cal-btn:hover{background:var(--color-surface-raised)}
.bk-manage-link{
  text-align:center;font-size:13px;color:var(--color-text-muted);margin-top:var(--space-4);
  line-height:1.6;
}
.bk-manage-link a{color:var(--color-primary);font-weight:500}

/* ===== MANAGE MODE ===== */
.bk-manage-header{
  padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--color-border);
  font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--color-text-muted);background:var(--color-surface-raised);
}
.bk-status-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;
  border-radius:var(--radius-full);font-size:12px;font-weight:600;letter-spacing:0.03em;
}
.bk-status-chip.booked{background:var(--color-accent-light);color:var(--color-accent-hover)}
.bk-status-chip.confirmed{background:var(--color-info-light);color:var(--color-info)}
.bk-status-chip.cancelled{background:var(--color-surface-raised);color:var(--color-text-muted)}
.bk-status-chip.seated{background:var(--color-primary-light);color:var(--color-primary)}
.bk-status-chip.completed{background:var(--color-success-light);color:var(--color-success)}
.bk-cancel-warn{
  background:var(--color-destructive-light);border:1px solid rgba(181,59,47,.15);
  border-radius:var(--radius-md);padding:var(--space-4);font-size:14px;
  color:var(--color-destructive);margin-bottom:var(--space-4);line-height:1.5;
}
.bk-btn-danger{
  min-height:48px;border-radius:var(--radius-full);width:100%;
  background:var(--color-destructive);color:var(--color-destructive-foreground);
  font-size:15px;font-weight:600;border:none;cursor:pointer;
  transition:filter var(--duration-fast),transform var(--duration-instant);
}
.bk-btn-danger:hover{filter:brightness(.9)}
.bk-btn-danger:active{transform:scale(.98)}
.bk-btn-danger:disabled{opacity:.5;cursor:not-allowed}
.bk-btn-danger:focus-visible{outline:2px solid var(--color-destructive);outline-offset:2px}

/* ===== ERROR INLINE ===== */
.bk-inline-error{
  background:var(--color-destructive-light);color:var(--color-destructive);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  font-size:14px;margin-bottom:var(--space-4);line-height:1.5;display:none;
}
.bk-inline-error.show{display:block}

/* ===== NOT FOUND ===== */
#not-found-screen{
  flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-8) var(--space-5);
}
.bk-nf-card{
  text-align:center;max-width:360px;padding:var(--space-10) var(--space-6);
}
.bk-nf-icon{
  width:72px;height:72px;border-radius:var(--radius-xl);background:var(--color-surface-raised);
  border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--space-5);color:var(--color-text-muted);
}
.bk-nf-title{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:var(--space-3)}
.bk-nf-body{font-size:15px;color:var(--color-text-secondary);line-height:1.6}

/* ===== FOOTER ===== */
.bk-footer{
  text-align:center;padding:var(--space-6) var(--space-5);
  font-size:12px;color:var(--color-text-muted);
}
.bk-footer a{color:var(--color-text-muted);text-decoration:none}
.bk-footer a:hover{color:var(--color-primary)}

/* ===== RESPONSIVE ===== */
@media(max-width:599px){
  .bk-main{padding:var(--space-5) var(--space-4) var(--space-10)}
  .bk-body{padding:var(--space-5)}
  .bk-progress{padding:var(--space-4) var(--space-5) var(--space-3)}
  .bk-section-title{font-size:16px;margin-bottom:var(--space-4)}
  .bk-confirm-title{font-size:19px}
  .bk-actions{flex-direction:column}
  .bk-btn-back{justify-content:center}
}
@media(max-width:374px){
  .bk-header-name{font-size:17px}
  .bk-btn-primary,.bk-btn-back{font-size:15px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ===== LOADING OVERLAY (initial page load) ===== -->
<div id="page-loading" aria-live="polite" role="status" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:var(--space-4)">
  <div class="bk-spin" style="width:36px;height:36px" aria-hidden="true"></div>
  <p style="font-size:14px;color:var(--color-text-muted)">Loading…</p>
</div>

<!-- ===== NOT FOUND SCREEN ===== -->
<div id="not-found-screen" style="display:none" aria-label="Restaurant not found">
  <div class="bk-nf-card">
    <div class="bk-nf-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
    </div>
    <h1 class="bk-nf-title">Page not found</h1>
    <p class="bk-nf-body" id="nf-message">This booking page isn't available. Please check the link you were given.</p>
  </div>
</div>

<!-- ===== MAIN BOOKING APP ===== -->
<div id="booking-app" style="display:none;flex-direction:column;min-height:100vh">

  <!-- Branded header -->
  <header class="bk-header" id="bk-header">
    <div class="bk-logo" id="bk-logo" aria-hidden="true">C</div>
    <div class="bk-header-info">
      <div class="bk-header-name" id="bk-rest-name">Restaurant</div>
      <div class="bk-header-address" id="bk-address"></div>
    </div>
    <div class="bk-header-badge" aria-label="Online booking available">Reserve online</div>
  </header>

  <main class="bk-main" id="bk-main">

    <!-- STEP CARD (date/party/slots/form/confirmation) -->
    <div class="bk-card" id="bk-card">
      <!-- Progress bar -->
      <div class="bk-progress" id="bk-progress" aria-hidden="true">
        <div class="bk-progress-track"><div class="bk-progress-fill" id="bk-progress-fill" style="width:25%"></div></div>
        <div class="bk-step-label" id="bk-step-label">Step 1 of 4</div>
      </div>

      <!-- Step body (dynamically populated) -->
      <div class="bk-body" id="bk-step-body">
        <!-- filled by JS -->
      </div>
    </div>

  </main>

  <footer class="bk-footer">
    <a href="index.html" rel="noopener">Powered by <strong>Coverly</strong></a>
  </footer>
</div>

<!-- ===== MANAGE MODE CARD ===== -->
<div id="manage-app" style="display:none;flex-direction:column;min-height:100vh">
  <header class="bk-header" id="manage-header">
    <div class="bk-logo" id="manage-logo" aria-hidden="true">C</div>
    <div class="bk-header-info">
      <div class="bk-header-name" id="manage-rest-name">Restaurant</div>
      <div class="bk-header-address" id="manage-rest-address"></div>
    </div>
  </header>

  <main class="bk-main">
    <div class="bk-card" id="manage-card">
      <div class="bk-manage-header">Manage your booking</div>
      <div class="bk-body" id="manage-body">
        <div class="bk-status">
          <div class="bk-status-icon loading" aria-hidden="true"><div class="bk-spin"></div></div>
          <p class="bk-status-desc" role="status">Loading your booking…</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bk-footer">
    <a href="index.html" rel="noopener">Powered by <strong>Coverly</strong></a>
  </footer>
</div>

function esc(str) {

function hide(id) { var e = el(id); if (e) e.style.display = 'none'; }

// Format a UTC ISO timestamp to local time in a given IANA tz
function fmtDate(iso, tz) {
  try {
    return new Intl.DateTimeFormat('en-GB', {
      timeZone: tz || 'UTC', weekday:'short', day:'numeric', month:'short', year:'numeric',
    }).format(new Date(iso));
  } catch(e) { return iso ? iso.slice(0, 10) : ''; }
}
function fmtTime(iso, tz) {

    return new Intl.DateTimeFormat('en-GB', {
      timeZone: tz || 'UTC', hour:'2-digit', minute:'2-digit', hour12:false,
    }).format(new Date(iso));
  } catch(e) { return ''; }
}
function fmtDateTime(iso, tz) {
  try {
    return new Intl.DateTimeFormat('en-GB', {
      timeZone: tz || 'UTC',
      weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false,
    }).format(new Date(iso));
  } catch(e) { return iso || ''; }
}

// Today's local date in YYYY-MM-DD for the given tz
function todayInTz(tz) {
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'UTC' }).format(new Date());
  } catch(e) {
    return new Date().toISOString().slice(0, 10);
  }
}

// Build ISO start time string from a date string (YYYY-MM-DD) and time string (HH:MM) in a given tz
// We need to convert local-tz datetime to UTC ISO for the RPC
function localToISO(dateStr, timeStr, tz) {
  // Use the Temporal-compatible approach: create a date string and interpret in the tz
  // Fallback: construct the naive datetime and offset
  try {
    // Use Intl to determine UTC offset at that moment
    var naive = dateStr + 'T' + timeStr + ':00';
    // Try using temporal-polyfill approach via Date constructor with timezone
    // Since we can't easily do this in vanilla JS without a library, we build a full ISO string
    // and let the RPC (which stores as timestamptz) handle it — OR we pass it in UTC.
    // Best approach: pass as an ISO string WITHOUT timezone so postgres interprets it
    // per the session timezone. But instead, we send the slot in local time and let the RPC
    // return available_slots in UTC ISO. We send the same UTC ISO back.
    // The available_slots RPC returns UTC ISO slot strings — we just store and pass them through.
    return naive; // naive local-tz string; caller should use the raw slot value from the RPC
  } catch(e) {
    return dateStr + 'T' + timeStr + ':00';
  }
}

// Apply brand color to CSS variable
function applyBrandColor(color) {
  if (!color || !/^#[0-9a-fA-F]{3,8}$/.test(color)) return;
  document.documentElement.style.setProperty('--color-restaurant-accent', color);
  // Determine if the color is light or dark for contrast
  var r = parseInt(color.slice(1,3), 16);
  var g = parseInt(color.slice(3,5), 16);
  var b = parseInt(color.slice(5,7), 16);
  var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  document.documentElement.style.setProperty(
    '--color-restaurant-accent-foreground', luminance > 0.55 ? '#1A1208' : '#FFFFFF'
  );
  // Update theme-color meta
  var tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.content = color;
}

   APP STATE
============================================================ */
var state = {
  restaurant: null,   // cov_restaurants row
  date: '',           // YYYY-MM-DD
  party: 0,           // int
  slots: [],          // array of { slot_start, free_tables } from RPC
  selectedSlot: null, // full slot object
  booking: null,      // result from cov_book RPC
  step: 1,            // 1=date, 2=party, 3=slots, 4=form
};

/* ============================================================
   URL PARSING
============================================================ */
function getParam(name) {
  var u = new URL(window.location.href);
  return u.searchParams.get(name) || '';
}
function getSlug() {
  var slug = getParam('r');
  if (!slug) {
    // fallback: hash-based #r=<slug>
    var m = window.location.hash.match(/[#&]r=([^&]+)/);
    if (m) slug = decodeURIComponent(m[1]);
  }
  return slug.trim();
}
function getManageToken() {
  return getParam('manage').trim();
}

/* ============================================================
   BOOT
============================================================ */
(async function boot() {
  var token = getManageToken();
  if (token) {
    await bootManage(token);
    return;
  }
  var slug = getSlug();
  if (!slug) {
    showNotFound('No restaurant specified. Please use the link provided by the restaurant.');
    return;
  }
  await bootBooking(slug);
})();

/* ============================================================
   BOOKING FLOW BOOT
============================================================ */
async function bootBooking(slug) {
  try {
    var { data: rows, error } = await sb
      .from('cov_restaurants')
      .select('id,name,slug,timezone,brand_color,logo_url,address,booking_enabled,max_party_online,default_turn_minutes')
      .eq('slug', slug)
      .eq('booking_enabled', true)
      .limit(1);

    if (error) throw error;
    if (!rows || rows.length === 0) {
      showNotFound('This restaurant isn\'t accepting online bookings, or the link is incorrect.');
      return;
    }

    state.restaurant = rows[0];
    applyBrandColor(state.restaurant.brand_color);
    renderBrandedHeader(state.restaurant);

    hide('page-loading');
    show('booking-app');

    // Default date to today
    state.date = todayInTz(state.restaurant.timezone);
    renderStep(1);
  } catch (err) {
    console.error('[coverly/book] boot error', err);
    showNotFound('Something went wrong loading this booking page. Please try again.');
  }
}

/* ============================================================
   BRANDED HEADER
============================================================ */
function renderBrandedHeader(rest) {
  var nameEl = el('bk-rest-name');
  var addrEl = el('bk-address');
  var logoEl = el('bk-logo');
  if (nameEl) nameEl.textContent = rest.name || 'Restaurant';
  if (addrEl) addrEl.textContent = rest.address || '';
  if (addrEl) addrEl.style.display = rest.address ? 'block' : 'none';
  if (logoEl) {
    if (rest.logo_url) {
      logoEl.innerHTML = '<img src="' + esc(rest.logo_url) + '" alt="' + esc(rest.name) + ' logo">';
    } else {
      logoEl.textContent = (rest.name || 'C').charAt(0).toUpperCase();
      logoEl.style.background = rest.brand_color || 'var(--color-primary)';
    }
  }
  document.title = 'Reserve a Table — ' + (rest.name || 'Coverly');
}

/* ============================================================
   STEP RENDERER
============================================================ */
var STEP_LABELS = ['', 'Pick a date', 'Party size', 'Choose a time', 'Your details'];
var STEP_PROGRESS = ['', '25%', '50%', '75%', '100%'];

function setProgress(step) {
  var fill = el('bk-progress-fill');
  var label = el('bk-step-label');
  if (fill) fill.style.width = STEP_PROGRESS[step] || '25%';
  if (label) label.textContent = 'Step ' + step + ' of 4';
  var progress = el('bk-progress');
  if (progress) progress.style.display = step <= 4 ? 'block' : 'none';
}

function renderStep(step) {
  state.step = step;
  setProgress(step);
  var body = el('bk-step-body');
  if (!body) return;

  switch (step) {
    case 1: body.innerHTML = renderDateStep(); wireDateStep(); break;
    case 2: body.innerHTML = renderPartyStep(); wirePartyStep(); break;
    case 3: renderSlotsStep(body); break;
    case 4: body.innerHTML = renderFormStep(); wireFormStep(); break;
    default: break;
  }
}

/* ============================================================
   STEP 1 — DATE
============================================================ */
function renderDateStep() {
  var min = todayInTz(state.restaurant.timezone);
  // Max: 60 days out
  var maxDate = new Date();
  maxDate.setDate(maxDate.getDate() + 60);
  var max = maxDate.toISOString().slice(0, 10);

  return [
    '<h2 class="bk-section-title" id="step1-heading">When would you like to visit?</h2>',
    '<div class="bk-form-row">',
      '<label for="bk-date-input">Date<span class="bk-required" aria-hidden="true">*</span></label>',
      '<input id="bk-date-input" class="bk-date-input" type="date"',
        ' min="' + min + '" max="' + max + '"',
        ' value="' + esc(state.date || min) + '"',
        ' aria-label="Select date" aria-required="true"',
        ' required>',
    '</div>',
    '<div class="bk-inline-error" id="step1-error" role="alert" aria-live="assertive"></div>',
    '<div class="bk-actions">',
      '<button class="bk-btn-primary" id="step1-next" aria-label="Continue to party size">',
        'Continue',
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>',
      '</button>',
    '</div>',
  ].join('');
}

function wireDateStep() {
  var inp = el('bk-date-input');
  var btn = el('step1-next');
  var errEl = el('step1-error');
  if (!btn || !inp) return;

  function next() {
    var val = inp.value;
    if (!val) { showInlineError(errEl, 'Please select a date.'); return; }
    var today = todayInTz(state.restaurant.timezone);
    if (val < today) { showInlineError(errEl, 'Please select today or a future date.'); return; }
    hideInlineError(errEl);
    state.date = val;
    renderStep(2);
  }

  btn.addEventListener('click', next);
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') next(); });
}

/* ============================================================
   STEP 2 — PARTY SIZE
============================================================ */
function renderPartyStep() {
  var max = state.restaurant.max_party_online || 10;
  var quickMax = Math.min(max, 10);
  var btns = '';
  for (var i = 1; i <= quickMax; i++) {
    btns += '<button class="bk-party-btn' + (state.party === i ? ' selected' : '') + '" data-party="' + i + '" aria-label="Party of ' + i + '" aria-pressed="' + (state.party === i ? 'true' : 'false') + '">' + i + '</button>';
  }

  var largeSection = max > 10 ? [
    '<button class="bk-party-more' + (state.party > 10 ? ' hidden' : '') + '" id="bk-party-more-btn" aria-label="Enter larger party size">',
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      'Larger party (11–' + max + ')',
    '</button>',
    '<div class="bk-party-large' + (state.party > 10 ? ' show' : '') + '" id="bk-party-large-row">',
      '<label for="bk-party-large-input" style="font-size:14px;font-weight:500;color:var(--color-text-secondary);white-space:nowrap">Party of:</label>',
      '<input id="bk-party-large-input" class="bk-date-input" type="number" min="11" max="' + max + '" value="' + (state.party > 10 ? state.party : '') + '" placeholder="11–' + max + '" aria-label="Enter party size between 11 and ' + max + '" style="max-width:120px;min-height:44px;font-size:15px">',
    '</div>',
  ].join('') : '';

  return [
    '<h2 class="bk-section-title" id="step2-heading">How many guests?</h2>',
    '<div class="bk-party-grid" role="group" aria-label="Select party size">', btns, '</div>',
    largeSection,
    '<div class="bk-inline-error" id="step2-error" role="alert" aria-live="assertive"></div>',
    '<div class="bk-actions">',
      '<button class="bk-btn-back" id="step2-back" aria-label="Back to date selection">',
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>',
        'Back',
      '</button>',
      '<button class="bk-btn-primary" id="step2-next" aria-label="Continue to time selection">',
        'Continue',
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>',
      '</button>',
    '</div>',
  ].join('');
}

function wirePartyStep() {
  var errEl = el('step2-error');
  var max = state.restaurant.max_party_online || 10;

  // Quick party buttons
  var btns = document.querySelectorAll('.bk-party-btn');
  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var p = parseInt(this.dataset.party, 10);
      state.party = p;
      btns.forEach(function(b) {
        var sel = parseInt(b.dataset.party, 10) === p;
        b.classList.toggle('selected', sel);
        b.setAttribute('aria-pressed', sel ? 'true' : 'false');
      });
    });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); }
    });
  });

  // Larger party toggle
  var moreBtn = el('bk-party-more-btn');
  var largeRow = el('bk-party-large-row');
  if (moreBtn && largeRow) {
    moreBtn.addEventListener('click', function() {
      moreBtn.classList.add('hidden');
      largeRow.classList.add('show');
      var inp = el('bk-party-large-input');
      if (inp) { inp.focus(); }
    });
    // Update state.party from large input
    var largeInp = el('bk-party-large-input');
    if (largeInp) {
      largeInp.addEventListener('input', function() {
        var v = parseInt(this.value, 10);
        if (v > 0) state.party = v;
      });
    }
  }

  el('step2-back').addEventListener('click', function() { renderStep(1); });

  function next() {
    // Re-check large input if visible
    var largeRow2 = el('bk-party-large-row');
    if (largeRow2 && largeRow2.classList.contains('show')) {
      var v = parseInt((el('bk-party-large-input') || {}).value || '0', 10);
      if (v > 0) state.party = v;
    }
    if (!state.party || state.party < 1) { showInlineError(errEl, 'Please select your party size.'); return; }
    if (state.party > max) { showInlineError(errEl, 'Maximum party size for online booking is ' + max + '. Please call us for larger parties.'); return; }
    hideInlineError(errEl);
    renderStep(3);
  }

  el('step2-next').addEventListener('click', next);
}

/* ============================================================
   STEP 3 — TIME SLOTS
============================================================ */
async function renderSlotsStep(body) {
  // Show loading
  body.innerHTML = [
    '<h2 class="bk-section-title">Choose a time</h2>',
    '<div class="bk-status" role="status" aria-live="polite" aria-label="Loading available times">',
      '<div class="bk-status-icon loading" aria-hidden="true"><div class="bk-spin"></div></div>',
      '<p class="bk-status-desc">Checking availability…</p>',
    '</div>',
  ].join('');

  try {
    var { data: slots, error } = await sb.rpc('cov_available_slots', {
      p_slug: state.restaurant.slug,
      p_date: state.date,
      p_party: state.party,
    });

    if (error) throw error;
    state.slots = slots || [];
    body.innerHTML = buildSlotsHTML(slots || []);
    wireSlots(body);
  } catch (err) {
    console.error('[coverly/book] slots error', err);
    body.innerHTML = buildSlotsErrorHTML();
    var retryBtn = body.querySelector('#slots-retry');
    if (retryBtn) {
      retryBtn.addEventListener('click', function() { renderSlotsStep(body); });
    }
    var backBtn = body.querySelector('#slots-err-back');
    if (backBtn) {
      backBtn.addEventListener('click', function() { renderStep(2); });
    }
  }
}

function buildSlotsHTML(slots) {
  var summaryDateStr = fmtDate(state.date + 'T12:00:00', state.restaurant.timezone);
  var parts = [
    '<h2 class="bk-section-title">Choose a time</h2>',
    '<p style="font-size:14px;color:var(--color-text-muted);margin-bottom:var(--space-4)">',
      esc(summaryDateStr) + ' &nbsp;·&nbsp; Party of ' + esc(String(state.party)),
    '</p>',
  ];

  if (!slots || slots.length === 0) {
    parts.push([
      '<div class="bk-status" role="status" aria-live="polite">',
        '<div class="bk-status-icon empty" aria-hidden="true">',
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
        '</div>',
        '<p class="bk-status-title">No availability</p>',
        '<p class="bk-status-desc">There are no available times for that date and party size. Try a different date.</p>',
      '</div>',
      '<div class="bk-actions">',
        '<button class="bk-btn-back" id="slots-back">',
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>',
          'Try another date',
        '</button>',
      '</div>',
    ].join(''));
  } else {
    parts.push('<div class="bk-slots-grid" role="group" aria-label="Available time slots">');
    slots.forEach(function(s) {
      var timeStr = fmtTime(s.slot_start, state.restaurant.timezone);
      var isLow = s.free_tables <= 2;
      var limitedHTML = isLow ? '<span class="bk-slot-limited">Limited</span>' : '';
      parts.push(
        '<button class="bk-slot" data-slot=\'' + JSON.stringify(s).replace(/'/g, '&#39;') + '\'' +
          ' aria-label="' + timeStr + (isLow ? ', limited availability' : '') + '"' +
          ' aria-pressed="false">',
          '<span>' + esc(timeStr) + '</span>',
          limitedHTML,
        '</button>'
      );
    });
    parts.push('</div>');
    parts.push([
      '<div class="bk-actions" style="margin-top:var(--space-5)">',
        '<button class="bk-btn-back" id="slots-back">',
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>',
          'Back',
        '</button>',
      '</div>',
    ].join(''));
  }

  return parts.join('');
}

        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>',
        'Back',

      '<button class="bk-btn-primary" id="slots-retry">Try again</button>',

function wireSlots(body) {
  var slots = body.querySelectorAll('.bk-slot');
  slots.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var slotData = null;
      try { slotData = JSON.parse(this.dataset.slot); } catch(e) {}
      if (!slotData) return;
      slots.forEach(function(b) { b.classList.remove('selected'); b.setAttribute('aria-pressed', 'false'); });
      this.classList.add('selected');
      this.setAttribute('aria-pressed', 'true');
      state.selectedSlot = slotData;
      // Brief delay so user sees the selection, then advance
      setTimeout(function() { renderStep(4); }, 200);
    });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); }
    });
  });
  var backBtn = body.querySelector('#slots-back');
  if (backBtn) {
    backBtn.addEventListener('click', function() { renderStep(2); });
  }
}

async function submitBooking() {
  var errEl = el('form-error');
  var nameEl = el('bk-name');
  var phoneEl = el('bk-phone');
  var emailEl = el('bk-email');
  var reqEl = el('bk-requests');
  var btn = el('form-submit');

  var name = nameEl ? nameEl.value.trim() : '';
  var phone = phoneEl ? phoneEl.value.trim() : '';
  var email = emailEl ? emailEl.value.trim() : '';
  var requests = reqEl ? reqEl.value.trim() : '';

  // Client-side validation
  hideInlineError(errEl);
  if (!name) { showInlineError(errEl, 'Please enter your name.'); if(nameEl) nameEl.focus(); return; }
  if (!phone) { showInlineError(errEl, 'Please enter your phone number.'); if(phoneEl) phoneEl.focus(); return; }
  if (phone.length < 7) { showInlineError(errEl, 'Please enter a valid phone number.'); if(phoneEl) phoneEl.focus(); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showInlineError(errEl, 'Please enter a valid email address, or leave it blank.'); if(emailEl) emailEl.focus(); return; }

  var slot = state.selectedSlot;
  if (!slot) { showInlineError(errEl, 'No time slot selected. Please go back and choose a time.'); return; }

  btn.disabled = true;
  btn.textContent = 'Confirming…';

  try {
    var { data: result, error } = await sb.rpc('cov_book', {
      p_slug:     state.restaurant.slug,
      p_start:    slot.slot_start,
      p_party:    state.party,
      p_name:     name,
      p_phone:    phone,
      p_email:    email || null,
      p_requests: requests || null,
    });

    btn.disabled = false;
    btn.textContent = 'Confirm reservation';

    if (error) throw error;

    if (!result) {
      showInlineError(errEl, 'Something went wrong. Please try again.');
      return;
    }

    if (result.ok) {
      state.booking = result;
      renderConfirmation(result, { name, phone, email, requests });
      return;
    }

    // Handle named RPC errors
    switch (result.error) {
      case 'no_availability':
        // Slot was just taken — re-fetch and offer alternatives
        showInlineError(errEl, 'That time was just taken. Fetching nearby available times…');
        btn.disabled = true;
        var body = el('bk-step-body');
        setTimeout(async function() {
          btn.disabled = false;
          if (body) await renderSlotsStep(body);
        }, 1200);
        break;
      case 'past_slot':
        showInlineError(errEl, 'That time has already passed. Please pick a future slot.');
        break;
      case 'party_out_of_range':
        showInlineError(errEl, 'The party size is outside the accepted range for online booking. Please call the restaurant.');
        break;
      case 'restaurant_unavailable':
        showInlineError(errEl, 'Online booking is currently unavailable. Please call the restaurant directly.');
        break;
      default:
        showInlineError(errEl, result.message || 'Booking failed. Please try again.');
    }
  } catch (err) {
    console.error('[coverly/book] book rpc error', err);
    btn.disabled = false;
    btn.textContent = 'Confirm reservation';
    showInlineError(errEl, 'Something went wrong. Please check your connection and try again.');
  }
}

/* ============================================================
   CONFIRMATION SCREEN
============================================================ */
function renderConfirmation(result, guestInfo) {
  var rest = state.restaurant;
  var slot = state.selectedSlot;
  var timeStr = slot ? fmtTime(slot.slot_start, rest.timezone) : '';
  var dateStr = state.date ? fmtDate(state.date + 'T12:00:00', rest.timezone) : '';
  var manageToken = result.manage_token || '';
  var manageUrl = manageToken
    ? window.location.origin + window.location.pathname + '?manage=' + encodeURIComponent(manageToken)
    : '';

  // Build .ics content for add-to-calendar
  var icsLink = '';
  if (slot && slot.slot_start) {
    var dtStart = slot.slot_start.replace(/[-:]/g, '').replace(/\.\d+/, '');
    if (!dtStart.endsWith('Z')) dtStart += 'Z';
    // End time: turn_minutes (default 90) after start
    var turnMs = (rest.default_turn_minutes || 90) * 60 * 1000;
    var endDate = new Date(new Date(slot.slot_start).getTime() + turnMs);
    var dtEnd = endDate.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    var icsBody = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Coverly//Booking//EN',
      'BEGIN:VEVENT',
      'DTSTART:' + dtStart,
      'DTEND:' + dtEnd,
      'SUMMARY:Table at ' + (rest.name || 'Restaurant'),
      'DESCRIPTION:Party of ' + state.party + (guestInfo.requests ? '. Notes: ' + guestInfo.requests : ''),
      'LOCATION:' + (rest.address || ''),
      'END:VEVENT',
      'END:VCALENDAR',
    ].join('\r\n');
    icsLink = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsBody);
  }

  var progress = el('bk-progress');
  if (progress) progress.style.display = 'none';

  var body = el('bk-step-body');
  if (!body) return;

  body.innerHTML = [
    '<div class="bk-confirm-icon" aria-hidden="true">',
      '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    '</div>',
    '<h2 class="bk-confirm-title">You\'re booked!</h2>',
    '<p class="bk-confirm-sub">We look forward to seeing you, ' + esc(guestInfo.name.split(' ')[0]) + '.</p>',
    '<div class="bk-confirm-detail" aria-label="Booking details">',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Restaurant</span><span class="bk-confirm-val">' + esc(rest.name) + '</span></div>',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Date</span><span class="bk-confirm-val">' + esc(dateStr) + '</span></div>',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Time</span><span class="bk-confirm-val">' + esc(timeStr) + '</span></div>',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Guests</span><span class="bk-confirm-val">' + esc(String(state.party)) + '</span></div>',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Name</span><span class="bk-confirm-val">' + esc(guestInfo.name) + '</span></div>',
      (guestInfo.requests ? '<div class="bk-confirm-row"><span class="bk-confirm-label">Requests</span><span class="bk-confirm-val">' + esc(guestInfo.requests) + '</span></div>' : ''),
    '</div>',
    '<div class="bk-confirm-actions">',
      (icsLink ? '<a class="bk-cal-btn" href="' + icsLink + '" download="reservation.ics" aria-label="Add to calendar">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
        'Add to calendar' +
      '</a>' : ''),
    '</div>',
    (manageUrl ? [
      '<div class="bk-manage-link">',
        'Need to change or cancel? <a href="' + esc(manageUrl) + '">Manage your booking</a>',
      '</div>',
    ].join('') : ''),
  ].join('');
}

/* ============================================================
   MANAGE MODE
============================================================ */
async function bootManage(token) {
  hide('page-loading');
  show('manage-app');

  try {
    var { data: result, error } = await sb.rpc('cov_manage_get', { p_token: token });

    if (error) throw error;

    if (!result || result.ok === false) {
      renderManageError('This manage link is invalid or has expired.');
      return;
    }

    // Load restaurant branding if possible
    var restId = result.restaurant_id || (result.reservation && result.reservation.restaurant_id);
    if (result.restaurant) {
      var rest = result.restaurant;
      applyBrandColor(rest.brand_color);
      var mname = el('manage-rest-name');
      var maddr = el('manage-rest-address');
      var mlogo = el('manage-logo');
      if (mname) mname.textContent = rest.name || 'Restaurant';
      if (maddr) { maddr.textContent = rest.address || ''; maddr.style.display = rest.address ? 'block' : 'none'; }
      if (mlogo) {
        if (rest.logo_url) {
          mlogo.innerHTML = '<img src="' + esc(rest.logo_url) + '" alt="' + esc(rest.name) + ' logo">';
        } else {
          mlogo.textContent = (rest.name || 'C').charAt(0).toUpperCase();
          mlogo.style.background = rest.brand_color || 'var(--color-primary)';
        }
      }
      document.title = 'Manage your booking — ' + (rest.name || 'Coverly');
    }

    renderManageView(result, token);
  } catch (err) {
    console.error('[coverly/book] manage_get error', err);
    renderManageError('We couldn\'t load your booking. Please check the link or try again.');
  }
}

function renderManageView(result, token) {
  var body = el('manage-body');
  if (!body) return;

  var res = result.reservation || result;
  var rest = result.restaurant || {};
  var tz = rest.timezone || 'UTC';
  var status = res.status || 'booked';
  var isCancelled = status === 'cancelled';
  var isCompleted = status === 'completed' || status === 'seated' || status === 'no_show';

  var guestName = (res.cov_guests && res.cov_guests.name) || res.guest_name || 'Guest';

  var timeStr = fmtDateTime(res.starts_at, tz);

  var statusChipClass = { booked:'booked', confirmed:'confirmed', cancelled:'cancelled', seated:'seated', completed:'completed' }[status] || 'booked';

  body.innerHTML = [
    '<div style="margin-bottom:var(--space-5);display:flex;align-items:center;gap:var(--space-3)">',
      '<h2 style="font-size:18px;font-weight:600;letter-spacing:-0.01em;flex:1;min-width:0">Your booking</h2>',
      '<span class="bk-status-chip ' + statusChipClass + '">' + esc(status) + '</span>',
    '</div>',
    '<div class="bk-confirm-detail" aria-label="Booking details">',
      (rest.name ? '<div class="bk-confirm-row"><span class="bk-confirm-label">Restaurant</span><span class="bk-confirm-val">' + esc(rest.name) + '</span></div>' : ''),
      '<div class="bk-confirm-row"><span class="bk-confirm-label">When</span><span class="bk-confirm-val">' + esc(timeStr) + '</span></div>',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Guests</span><span class="bk-confirm-val">' + esc(String(res.party_size || '')) + '</span></div>',
      '<div class="bk-confirm-row"><span class="bk-confirm-label">Name</span><span class="bk-confirm-val">' + esc(guestName) + '</span></div>',
      (res.special_requests ? '<div class="bk-confirm-row"><span class="bk-confirm-label">Requests</span><span class="bk-confirm-val">' + esc(res.special_requests) + '</span></div>' : ''),
    '</div>',
    (!isCancelled && !isCompleted ? [
      '<div id="cancel-section">',
        '<div class="bk-cancel-warn" role="note">',
          'To cancel, tap the button below. This cannot be undone.',
        '</div>',
        '<div class="bk-inline-error" id="cancel-error" role="alert" aria-live="assertive"></div>',
        '<button class="bk-btn-danger" id="cancel-btn" aria-label="Cancel this reservation">Cancel reservation</button>',
      '</div>',
    ].join('') : ''),
    (isCancelled ? '<div class="bk-status-chip cancelled" style="width:100%;justify-content:center;padding:var(--space-3)">This reservation has been cancelled.</div>' : ''),
    (isCompleted ? '<div class="bk-status-chip completed" style="width:100%;justify-content:center;padding:var(--space-3)">This reservation is complete — thank you for visiting!</div>' : ''),
  ].join('');

  var cancelBtn = el('cancel-btn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function() { doManageCancel(token, res); });
  }
}

async function doManageCancel(token, res) {
  var cancelBtn = el('cancel-btn');
  var errEl = el('cancel-error');
  if (errEl) hideInlineError(errEl);
  if (cancelBtn) { cancelBtn.disabled = true; cancelBtn.textContent = 'Cancelling…'; }

  try {
    var { data: result, error } = await sb.rpc('cov_manage_cancel', { p_token: token });

    if (error) throw error;

    if (!result || result.ok === false) {
      if (cancelBtn) { cancelBtn.disabled = false; cancelBtn.textContent = 'Cancel reservation'; }
      if (errEl) showInlineError(errEl, result && result.error === 'already_cancelled' ? 'This reservation is already cancelled.' : 'Could not cancel. Please contact the restaurant directly.');
      return;
    }

    // Success — show cancelled state
    var body = el('manage-body');
    if (body) {
      var section = el('cancel-section');
      if (section) {
        section.innerHTML = '<div class="bk-status" role="status" aria-live="polite">' +
          '<div class="bk-status-icon success" aria-hidden="true">' +
            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '</div>' +
          '<p class="bk-status-title">Reservation cancelled</p>' +
          '<p class="bk-status-desc">Your reservation has been cancelled successfully. We hope to see you another time.</p>' +
        '</div>';
      }
    }
  } catch (err) {
    console.error('[coverly/book] manage_cancel error', err);
    if (cancelBtn) { cancelBtn.disabled = false; cancelBtn.textContent = 'Cancel reservation'; }
    if (errEl) showInlineError(errEl, 'Something went wrong. Please try again or contact the restaurant.');
  }
}

function renderManageError(msg) {
  var body = el('manage-body');
  if (!body) return;
  body.innerHTML = [
    '<div class="bk-status" role="alert">',
      '<div class="bk-status-icon error" aria-hidden="true">',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-destructive)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
      '</div>',
      '<p class="bk-status-title">Booking not found</p>',
      '<p class="bk-status-desc">' + esc(msg) + '</p>',
    '</div>',
  ].join('');
}

/* ============================================================
   NOT FOUND
============================================================ */
function showNotFound(msg) {
  hide('page-loading');
  hide('booking-app');
  hide('manage-app');
  var nfMsg = el('nf-message');
  if (nfMsg && msg) nfMsg.textContent = msg;
  show('not-found-screen');
}

/* ============================================================
   INLINE ERROR HELPERS
============================================================ */
function showInlineError(el, msg) {
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  el.style.display = 'block';
  el.focus();
}
function hideInlineError(el) {
  if (!el) return;
  el.classList.remove('show');
  el.style.display = 'none';
  el.textContent = '';
}

}());
</script>
